<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORJA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17181a;
    --bg-elevated: #202226;
    --bg-card: #26282c;
    --border: #34363b;
    --text: #ece8de;
    --text-dim: #8f9096;
    --accent: #d64d3f;
    --accent-dim: #4a2320;
    --gold: #c9a15a;
    --steel: #5b7a90;
    --radius: 12px;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--bg); color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  .app{ max-width: 480px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; }
  .topbar{
    padding: 20px 20px 14px; display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom: 1px solid var(--border);
  }
  .brand{
    font-family: var(--font-display); font-weight:700; font-size: 26px; letter-spacing: 2px;
    display:flex; align-items:center; gap:8px;
  }
  .brand .bar{ display:flex; gap:3px; }
  .brand .bar span{ width:6px; height:14px; background: var(--accent); border-radius:1px; display:inline-block; }
  .brand .bar span:nth-child(2){ height:20px; }
  .brand .bar span:nth-child(3){ height:10px; }
  .date{ font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); text-transform: capitalize; }
  main{ flex:1; padding: 18px 16px 100px; }
  .tabbar{
    position: sticky; bottom:0; display:flex; background: var(--bg-elevated);
    border-top: 1px solid var(--border);
  }
  .tab-btn{
    flex:1; background:none; border:none; color: var(--text-dim); font-family: var(--font-display);
    font-size: 10.5px; letter-spacing: 0.5px; text-transform: uppercase; padding: 14px 2px 10px; cursor:pointer;
    border-top: 2px solid transparent;
  }
  .tab-btn.active{ color: var(--text); border-top-color: var(--accent); }
  h2{ font-family: var(--font-display); font-weight:600; font-size:20px; margin: 0 0 14px; letter-spacing:0.5px; }
  h3{ font-family: var(--font-display); font-weight:500; font-size:15px; margin: 0 0 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .card{
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 12px;
  }
  .empty{ color: var(--text-dim); font-size: 14px; line-height:1.5; padding: 10px 2px; }
  select, input[type=text], input[type=number]{
    background: var(--bg-elevated); border:1px solid var(--border); color: var(--text);
    font-family: var(--font-body); font-size:14px; padding: 9px 10px; border-radius: 8px; width:100%;
  }
  select:focus, input:focus{ outline: none; border-color: var(--steel); }
  button{ font-family: var(--font-body); cursor:pointer; }
  .btn{
    background: var(--accent); color:#fff; border:none; border-radius:8px; padding: 9px 14px;
    font-weight:600; font-size:13px; white-space:nowrap;
  }
  .btn:active{ opacity:0.85; }
  .btn-ghost{
    background:none; border:1px solid var(--border); color: var(--text-dim); border-radius:8px;
    padding: 8px 12px; font-size:13px;
  }
  .btn-icon{
    background:none; border:none; color: var(--text-dim); font-size:16px; padding:2px 6px; line-height:1;
  }
  .row{ display:flex; gap:8px; align-items:center; }
  .row.gap-top{ margin-top:10px; }
  .exercise-block{ padding: 10px 0; border-top: 1px solid var(--border); }
  .exercise-block:first-child{ border-top:none; padding-top:0; }
  .exercise-name{ font-weight:600; font-size:14px; }
  .exercise-target{ font-family: var(--font-mono); font-size:11px; color: var(--gold); margin-bottom:6px; }
  .sets-list{ display:flex; flex-wrap:wrap; gap:6px; margin: 6px 0 8px; }
  .set-chip{
    font-family: var(--font-mono); font-size:12px; background: var(--bg-elevated);
    border:1px solid var(--border); border-radius:20px; padding:5px 8px 5px 10px;
    display:flex; align-items:center; gap:6px; color: var(--text);
  }
  .set-chip button{ background:none; border:none; color: var(--text-dim); font-size:13px; padding:0; }
  .habit-row{
    display:flex; align-items:center; justify-content:space-between; padding: 10px 0;
    border-top:1px solid var(--border);
  }
  .habit-row:first-child{ border-top:none; }
  .habit-check{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--border); background:none;
    display:flex; align-items:center; justify-content:center; color:transparent; font-size:14px; flex-shrink:0;
  }
  .habit-check.done{ background: var(--gold); border-color: var(--gold); color: #17181a; }
  .habit-info{ display:flex; align-items:center; gap:10px; flex:1; }
  .habit-name{ font-size:14px; font-weight:500; }
  .streak{ font-family: var(--font-mono); font-size:11px; color: var(--gold); }
  .heat{ display:flex; gap:3px; margin-top:4px; flex-wrap:wrap; }
  .heat span{ width:8px; height:8px; border-radius:2px; background: var(--bg-elevated); border:1px solid var(--border); }
  .heat span.on{ background: var(--gold); border-color: var(--gold); }
  .heat30 span{ width:9px; height:9px; }
  .bar-chart{ height:130px; }
  .exercise-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .exercise-box{
    background: var(--bg-card); border:1px solid var(--border); border-radius:12px;
    padding:14px 6px; text-align:center; cursor:pointer;
  }
  .exercise-box.selected{ border-color: var(--accent); background: var(--accent-dim); }
  .exercise-box .w{ font-family: var(--font-mono); font-weight:700; font-size:19px; color: var(--accent); }
  .exercise-box .n{ font-size:10.5px; color: var(--text-dim); margin-top:4px; line-height:1.25; }
  .pr-box{ text-align:center; padding: 18px 0 10px; }
  .pr-label{ font-size:11px; letter-spacing:2px; color: var(--text-dim); text-transform:uppercase; }
  .pr-value{ font-family: var(--font-mono); font-weight:700; font-size:44px; color: var(--accent); line-height:1.1; }
  .pr-unit{ font-size:16px; color: var(--text-dim); }
  .chart{ width:100%; height:150px; margin-top:6px; }
  .history-item{
    display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-top:1px solid var(--border);
  }
  .history-item:first-child{ border-top:none; }
  .history-item .d{ color: var(--text-dim); font-family: var(--font-mono); font-size:12px; }
  .history-item .w{ font-family: var(--font-mono); font-weight:600; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip{
    font-size:12px; background: var(--bg-elevated); border:1px solid var(--border); border-radius:20px;
    padding:5px 10px; display:flex; align-items:center; gap:6px;
  }
  .chip .t{ color: var(--gold); font-family: var(--font-mono); font-size:11px; }
  .chip button{ background:none; border:none; color: var(--text-dim); font-size:12px; padding:0; }
  .routine-card .title-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .routine-card .title-row input{ font-family:var(--font-display); font-weight:600; font-size:16px; border:none; background:none; padding:2px 0; }
  .link-btn{ background:none; border:none; color: var(--steel); font-size:13px; padding:6px 0; font-weight:600; }
  .section-gap{ margin-top:22px; }
  .divider{ height:1px; background: var(--border); margin: 18px 0; }
  .dropdown{ position:relative; }
  .dropdown-trigger{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background: var(--bg-elevated); border:1px solid var(--border); border-radius:8px;
    padding: 11px 13px; font-family: var(--font-display); font-size:14px; letter-spacing:0.3px;
    color: var(--text); cursor:pointer; user-select:none;
  }
  .dropdown.open .dropdown-trigger{ border-color: var(--steel); }
  .dropdown-trigger .placeholder{ color: var(--text-dim); font-weight:400; }
  .dropdown-trigger .chev{
    width:8px; height:8px; border-right:2px solid var(--text-dim); border-bottom:2px solid var(--text-dim);
    transform: rotate(45deg); transition: transform .15s ease; margin-left:10px; flex-shrink:0;
  }
  .dropdown.open .dropdown-trigger .chev{ transform: rotate(-135deg); }
  .dropdown-panel{
    position:absolute; top: calc(100% + 6px); left:0; right:0; background: var(--bg-card);
    border:1px solid var(--border); border-radius:10px; z-index:50; max-height:260px; overflow-y:auto;
    box-shadow: 0 14px 28px rgba(0,0,0,0.5); display:none;
  }
  .dropdown.open .dropdown-panel{ display:block; }
  .dropdown-option{
    display:flex; align-items:center; gap:9px; padding:11px 13px; font-size:13.5px; cursor:pointer;
    border-top:1px solid var(--border); color: var(--text-dim);
  }
  .dropdown-option:first-child{ border-top:none; }
  .dropdown-option:hover{ background: var(--bg-elevated); }
  .dropdown-option .mark{ width:3px; height:15px; background: var(--accent); border-radius:1px; opacity:0; flex-shrink:0; }
  .dropdown-option.selected{ color: var(--text); font-weight:600; }
  .dropdown-option.selected .mark{ opacity:1; }
  .plan-item{ font-size:13px; line-height:1.6; margin-bottom:10px; }
  .plan-item b{ color: var(--text); }
  .plan-item .lbl{ color: var(--gold); font-family: var(--font-mono); font-size:10.5px; letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:2px; }
  .goal-row{ display:flex; justify-content:space-between; align-items:baseline; margin-top:4px; }
  .goal-num{ font-family: var(--font-mono); font-weight:700; font-size:22px; color: var(--accent); }
  .goal-arrow{ color: var(--text-dim); font-size:13px; }
  .set-controls{ background: var(--bg-elevated); border-radius:10px; padding:10px 12px; margin-top:6px; }
  .stepper-row{ display:flex; justify-content:space-between; align-items:center; padding:5px 0; }
  .stepper-label{ font-size:12.5px; color: var(--text-dim); }
  .stepper{ display:flex; align-items:center; gap:12px; }
  .stepper button{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--border);
    background: var(--bg-card); color: var(--text); font-size:17px; font-weight:700; line-height:1;
  }
  .stepper button:active{ background: var(--accent-dim); }
  .stepper-val{ font-family: var(--font-mono); font-weight:700; font-size:15px; min-width:60px; text-align:center; }
  .btn-full{ width:100%; margin-top:8px; padding:11px; font-size:14px; }
</style>

<script>
/* ---------- Config de Firebase ----------
   Pegá acá tu config real (Firebase Console > Configuración del
   proyecto > Tus apps > Config del SDK). Solo se usa para la pestaña
   Dúo — no hace falta Authentication, ni siquiera anónimo. */
    const firebaseConfig = {
        apiKey: "AIzaSyASAZ0kqz9_HCw_AOwKTkbk49OswaPugH4",
        authDomain: "forja-dc500.firebaseapp.com",
        projectId: "forja-dc500",
        storageBucket: "forja-dc500.firebasestorage.app",
        messagingSenderId: "847181119010",
        appId: "1:847181119010:web:409af6044cb185073d547b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

/* ---------- window.storage híbrido ----------
   shared=false (tus datos personales: rutinas, series, hábitos, peso)
     -> puente nativo con Swift, guardado como archivos reales en disco.
        Esto es lo que garantiza que persista entre reinicios de la app.
   shared=true (el resumen de la pestaña Dúo)
     -> Firestore, para que viaje a la Mac/iPhone de tu amigo. */
let __forjaReqCounter = 0;
const __forjaPending = {};
window.__forjaStorageResolve = function(id, resultJson){
  const p = __forjaPending[id];
  if(!p) return;
  delete __forjaPending[id];
  let result;
  try{ result = JSON.parse(resultJson); }catch(e){ result = { error: 'Respuesta inválida' }; }
  if(result.error) p.reject(new Error(result.error));
  else p.resolve(result.value);
};
function __forjaNativeCall(action, payload){
  return new Promise((resolve, reject) => {
    const id = 'r' + (++__forjaReqCounter);
    __forjaPending[id] = { resolve, reject };
    window.webkit.messageHandlers.forjaStorage.postMessage(Object.assign({ id, action }, payload));
  });
}

window.storage = {
  async get(key, shared=false){
    if(shared){
      const snap = await db.collection('shared').doc(key).get();
      if(!snap.exists) throw new Error('Clave no encontrada: ' + key);
      return { key, value: snap.data().value, shared: true };
    }
    const value = await __forjaNativeCall('get', { key });
    return { key, value, shared: false };
  },
  async set(key, value, shared=false){
    if(shared){
      await db.collection('shared').doc(key).set({ key, value, updatedAt: Date.now() });
      return { key, value, shared: true };
    }
    await __forjaNativeCall('set', { key, value });
    return { key, value, shared: false };
  },
  async delete(key, shared=false){
    if(shared){
      await db.collection('shared').doc(key).delete();
      return { key, deleted: true, shared: true };
    }
    await __forjaNativeCall('delete', { key });
    return { key, deleted: true, shared: false };
  },
  async list(prefix='', shared=false){
    if(shared){
      const col = db.collection('shared');
      const query = prefix ? col.where('key','>=',prefix).where('key','<',prefix+'\uf8ff') : col;
      const snap = await query.get();
      const keys = [];
      snap.forEach(doc => keys.push(doc.id));
      return { keys, prefix, shared: true };
    }
    const keys = await __forjaNativeCall('list', { prefix });
    return { keys, prefix, shared: false };
  }
};
</script>
<script>
let state = { routines: [], exercises: [], logs: {}, habits: [], habitLogs: {}, bodyWeightLogs: {}, seeded: false, profile: { name: '' } };
let currentTab = 'hoy';
let progressExerciseId = null;
let duoMembers = [];
let duoLoading = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateKeyOffset(daysAgo){
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ---------- SEED: rutina de estética 12 meses ---------- */
function seedDefaultPlan(){
  const mk = (name) => {
    let ex = state.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
    if(!ex){ ex = { id: uid(), name }; state.exercises.push(ex); }
    return ex.id;
  };
  const routine = (name, list) => ({
    id: uid(), name,
    exercises: list.map(([n, target]) => ({ exerciseId: mk(n), target }))
  });

  state.routines.push(
    routine('Lunes · Upper A (Fuerza)', [
      ['Press inclinado con barra', '4x6-8'],
      ['Dominadas o jalón pesado', '4x6-8'],
      ['Press plano con mancuernas', '3x8-10'],
      ['Remo pecho apoyado', '4x8-10'],
      ['Elevaciones laterales en polea', '4x12-15'],
      ['Face Pull', '3x15-20'],
      ['Extensión de tríceps', '3x10-12'],
      ['Curl inclinado', '3x10-12'],
    ]),
    routine('Martes · Lower A', [
      ['Sentadilla Hack', '4x6-8'],
      ['Peso muerto rumano', '4x8-10'],
      ['Prensa', '3x10-12'],
      ['Curl femoral', '4x10-12'],
      ['Extensión de cuádriceps', '2x15'],
      ['Gemelos', '5x12-15'],
      ['Crunch en polea', '3x15'],
    ]),
    routine('Jueves · Upper B (Hipertrofia)', [
      ['Press inclinado en máquina', '4x10-12'],
      ['Jalón unilateral', '4x10-12'],
      ['Pec Deck', '3x12-15'],
      ['Remo unilateral', '3x10-12'],
      ['Elevaciones laterales', '5x15-20'],
      ['Pájaros (deltoides posterior)', '4x15'],
      ['Press militar en máquina', '3x8-10'],
      ['Tríceps cuerda', '3x12-15'],
      ['Curl martillo', '3x10-12'],
    ]),
    routine('Viernes · Lower B', [
      ['Prensa pesada', '4x10'],
      ['Bulgarian Split Squat', '3x10'],
      ['Peso muerto rumano', '3x8'],
      ['Curl femoral', '3x12'],
      ['Gemelos', '5x15'],
      ['Elevaciones de piernas', '3x15'],
    ]),
    routine('Sábado · Hombros y Brazos', [
      ['Elevaciones laterales', '6x15-20'],
      ['Press militar', '3x8-10'],
      ['Face Pull', '4x15'],
      ['Curl barra EZ', '4x8-10'],
      ['Curl inclinado', '3x12'],
      ['Skull Crushers', '4x10'],
      ['Extensión de tríceps', '3x12'],
    ]),
  );
  state.seeded = true;
}

let identityName = '';

function stateKey(){
  return 'state:' + identityName.trim().toLowerCase();
}

async function boot(){
  try{
    const res = await window.storage.get('identity', false);
    identityName = (res && res.value) ? res.value.trim() : '';
  }catch(e){ identityName = ''; }

  if(!identityName){
    renderIdentityGate();
    return;
  }
  await loadStateForIdentity();
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
  render();
}

async function loadStateForIdentity(){
  try{
    const res = await window.storage.get(stateKey(), true);
    const parsed = JSON.parse(res.value);
    state = Object.assign({ routines: [], exercises: [], logs: {}, habits: [], habitLogs: {}, bodyWeightLogs: {}, seeded: false, profile: { name: identityName } }, parsed);
  }catch(e){
    state = { routines: [], exercises: [], logs: {}, habits: [], habitLogs: {}, bodyWeightLogs: {}, seeded: false, profile: { name: identityName } };
  }
  state.profile = state.profile || {};
  state.profile.name = identityName;
  if(!state.seeded && state.routines.length === 0){
    seedDefaultPlan();
    await saveState();
  }
}

async function saveState(){
  try{ await window.storage.set(stateKey(), JSON.stringify(state), true); }
  catch(e){ console.error('No se pudo guardar', e); }
  pushMySummary();
}

function renderIdentityGate(){
  document.body.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;">
      <div class="card" style="max-width:340px;width:100%;">
        <h2 style="margin-top:0;">Bienvenido a FORJA</h2>
        <p class="empty" style="padding:0 0 12px;">Elegí tu nombre. Con eso identificamos tu progreso y lo sincronizamos entre tus dispositivos (Mac, iPhone) y con quien compartas la app.</p>
        <input type="text" id="identityInput" placeholder="Tu nombre">
        <button class="btn" style="width:100%;margin-top:10px;" onclick="submitIdentity()">Continuar</button>
      </div>
    </div>`;
}

async function submitIdentity(){
  const input = document.getElementById('identityInput');
  const name = (input.value || '').trim();
  if(!name) return;
  try{
    await window.storage.set('identity', name, false);
    location.reload();
  }catch(e){ console.error('No se pudo guardar la identidad', e); }
}

async function switchIdentity(){
  try{ await window.storage.delete('identity', false); }catch(e){}
  location.reload();
}

function buildDropdown(id, options, selectedValue, placeholder, onSelectFn){
  const selectedOpt = options.find(o => String(o.value) === String(selectedValue));
  const label = selectedOpt ? selectedOpt.label : placeholder;
  const optsHtml = options.map(o => `
    <div class="dropdown-option ${String(o.value)===String(selectedValue)?'selected':''}" onclick="${onSelectFn}('${o.value}')">
      <span class="mark"></span>${escapeHtml(o.label)}
    </div>`).join('');
  return `
    <div class="dropdown" data-id="${id}">
      <div class="dropdown-trigger" onclick="toggleDropdown('${id}')">
        <span class="${selectedOpt?'':'placeholder'}">${escapeHtml(label)}</span>
        <span class="chev"></span>
      </div>
      <div class="dropdown-panel">${optsHtml || '<div class="dropdown-option">Nada por acá todavía</div>'}</div>
    </div>`;
}
function toggleDropdown(id){
  document.querySelectorAll('.dropdown').forEach(d => { if(d.dataset.id !== id) d.classList.remove('open'); });
  const el = document.querySelector(`.dropdown[data-id="${id}"]`);
  if(el) el.classList.toggle('open');
}
document.addEventListener('click', (e) => {
  if(!e.target.closest('.dropdown')){
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
  }
});
function selectProgressExercise(id){
  progressExerciseId = id;
  render();
}

function switchTab(tab){
  currentTab = tab;
  if(tab === 'duo') refreshDuo();
  render();
}

function render(){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
  const content = document.getElementById('content');
  if(currentTab === 'hoy') content.innerHTML = renderHoy();
  else if(currentTab === 'progreso') content.innerHTML = renderProgreso();
  else if(currentTab === 'habitos') content.innerHTML = renderHabitos();
  else if(currentTab === 'rutinas') content.innerHTML = renderRutinas();
  else if(currentTab === 'duo') content.innerHTML = renderDuo();
}

/* ---------- HOY ---------- */
function renderHoy(){
  const key = todayKey();
  if(!state.logs[key]) state.logs[key] = { routineId: null, sets: [] };
  const dayLog = state.logs[key];

  let routineSection;
  if(state.routines.length === 0){
    routineSection = `<div class="card"><p class="empty">Todavía no tenés rutinas creadas. Andá a la pestaña <b>Rutinas</b> para armar tu primer día de entrenamiento.</p></div>`;
  } else {
    const ddOptions = state.routines.map(r => ({ value: r.id, label: r.name }));
    const routine = state.routines.find(r => r.id === dayLog.routineId);
    let exBlocks = '';
    if(routine){
      if(routine.exercises.length === 0){
        exBlocks = `<p class="empty">Esta rutina no tiene ejercicios todavía.</p>`;
      } else {
        exBlocks = routine.exercises.map(({exerciseId, target}) => {
          const ex = state.exercises.find(e => e.id === exerciseId);
          if(!ex) return '';
          const sets = dayLog.sets.filter(s => s.exerciseId === exerciseId);
          const chips = sets.map(s => {
            const realIdx = dayLog.sets.indexOf(s);
            return `<span class="set-chip">${s.reps}x${s.weight}kg <button onclick="deleteSet('${realIdx}')">✕</button></span>`;
          }).join('');
          const draft = getDraft(ex.id, target);
          return `
            <div class="exercise-block">
              <div class="exercise-name">${escapeHtml(ex.name)}</div>
              ${target ? `<div class="exercise-target">Objetivo: ${escapeHtml(target)}</div>` : ''}
              <div class="sets-list">${chips || '<span class="empty" style="padding:0;font-size:12px;">Sin series todavía</span>'}</div>
              <div class="set-controls">
                <div class="stepper-row">
                  <span class="stepper-label">Reps</span>
                  <div class="stepper">
                    <button onclick="adjustDraft('${ex.id}','reps',-1,'${target||''}')">−</button>
                    <span class="stepper-val">${draft.reps}</span>
                    <button onclick="adjustDraft('${ex.id}','reps',1,'${target||''}')">+</button>
                  </div>
                </div>
                <div class="stepper-row">
                  <span class="stepper-label">Peso</span>
                  <div class="stepper">
                    <button onclick="adjustDraft('${ex.id}','weight',-2.5,'${target||''}')">−</button>
                    <span class="stepper-val">${draft.weight} kg</span>
                    <button onclick="adjustDraft('${ex.id}','weight',2.5,'${target||''}')">+</button>
                  </div>
                </div>
                <button class="btn btn-full" onclick="commitSet('${ex.id}')">Guardar serie</button>
              </div>
            </div>`;
        }).join('');
      }
    }
    routineSection = `
      <div class="card">
        <h3>Rutina de hoy</h3>
        ${buildDropdown('routine-today', ddOptions, dayLog.routineId || '', 'Elegí una rutina', 'selectTodayRoutine')}
        ${routine ? `<div class="section-gap">${exBlocks}</div>` : ''}
      </div>`;
  }

  let habitSection = '';
  if(state.habits.length > 0){
    const rows = state.habits.map(h => {
      const done = (state.habitLogs[key] || []).includes(h.id);
      const streak = computeStreak(h.id);
      return `
        <div class="habit-row">
          <div class="habit-info">
            <button class="habit-check ${done?'done':''}" onclick="toggleHabit('${h.id}')">${done?'✓':''}</button>
            <span class="habit-name">${escapeHtml(h.name)}</span>
          </div>
          <span class="streak">${streak > 0 ? streak + ' 🔥' : ''}</span>
        </div>`;
    }).join('');
    habitSection = `<div class="card section-gap"><h3>Hábitos de hoy</h3>${rows}</div>`;
  }

  return routineSection + habitSection;
}

function selectTodayRoutine(routineId){
  const key = todayKey();
  state.logs[key].routineId = routineId || null;
  saveState(); render();
}
/* Valores de reps/peso "en preparación" por ejercicio: arrancan con la última
   serie registrada (hoy o en una sesión anterior) para que cargar una serie
   sea, la mayoría de las veces, solo tocar "Guardar serie". */
let exerciseDrafts = {};

function findLastSetForExercise(exerciseId){
  const dates = Object.keys(state.logs).sort().reverse();
  for(const d of dates){
    const sets = state.logs[d].sets.filter(s => s.exerciseId === exerciseId);
    if(sets.length) return sets[sets.length-1];
  }
  return null;
}
function parseTargetReps(target){
  if(target){
    const m = target.match(/x(\d+)/);
    if(m) return parseInt(m[1], 10);
  }
  return 8;
}
function getDraft(exerciseId, target){
  if(!exerciseDrafts[exerciseId]){
    const last = findLastSetForExercise(exerciseId);
    exerciseDrafts[exerciseId] = last
      ? { reps: last.reps, weight: last.weight }
      : { reps: parseTargetReps(target), weight: 20 };
  }
  return exerciseDrafts[exerciseId];
}
function adjustDraft(exerciseId, field, delta, target){
  const d = getDraft(exerciseId, target);
  let val = d[field] + delta;
  if(field === 'reps') val = Math.max(1, val);
  else val = Math.max(0, Math.round(val * 4) / 4);
  d[field] = val;
  render();
}
function commitSet(exerciseId){
  const d = exerciseDrafts[exerciseId];
  if(!d || !d.reps || d.weight === undefined) return;
  const key = todayKey();
  state.logs[key].sets.push({ exerciseId, reps: d.reps, weight: d.weight, ts: Date.now() });
  saveState(); render();
}
function deleteSet(idx){
  const key = todayKey();
  state.logs[key].sets.splice(idx, 1);
  saveState(); render();
}

/* ---------- HABITOS ---------- */
function computeStreak(habitId){
  let streak = 0;
  for(let i=0; i<365; i++){
    const key = dateKeyOffset(i);
    const done = (state.habitLogs[key] || []).includes(habitId);
    if(done) streak++;
    else { if(i===0) continue; break; }
  }
  return streak;
}
function toggleHabit(habitId){
  const key = todayKey();
  if(!state.habitLogs[key]) state.habitLogs[key] = [];
  const arr = state.habitLogs[key];
  const idx = arr.indexOf(habitId);
  if(idx >= 0) arr.splice(idx, 1); else arr.push(habitId);
  saveState(); render();
}
function renderHabitos(){
  const key = todayKey();

  let checkSection;
  if(state.habits.length === 0){
    checkSection = '<div class="card"><p class="empty">Agregá hábitos que quieras trackear día a día: proteína, sueño 7.5-9h, agua, pasos...</p></div>';
  } else {
    const rows = state.habits.map(h => {
      const done = (state.habitLogs[key] || []).includes(h.id);
      const streak = computeStreak(h.id);
      return `
        <div class="habit-row">
          <div class="habit-info">
            <button class="habit-check ${done?'done':''}" onclick="toggleHabit('${h.id}')">${done?'✓':''}</button>
            <span class="habit-name">${escapeHtml(h.name)}</span>
          </div>
          <span class="streak">${streak > 0 ? streak + ' 🔥' : ''}</span>
        </div>`;
    }).join('');
    checkSection = `<div class="card"><h3>Marcar hoy</h3>${rows}</div>`;
  }

  let overallChart = '';
  if(state.habits.length > 0){
    const days = Array.from({length:14}).map((_,i) => dateKeyOffset(13-i));
    const items = days.map(d => {
      const doneCount = (state.habitLogs[d] || []).filter(id => state.habits.some(h => h.id === id)).length;
      const pct = Math.round((doneCount / state.habits.length) * 100);
      return { label: dayNum(d), value: pct };
    });
    overallChart = `
      <div class="card section-gap">
        <h3>Cumplimiento general · últimos 14 días</h3>
        ${renderBarChart(items, { max: 100 })}
      </div>`;
  }

  const habitCards = state.habits.map(h => {
    const streak = computeStreak(h.id);
    const days30 = Array.from({length:30}).map((_,i) => dateKeyOffset(29-i));
    const cells = days30.map(d => {
      const on = (state.habitLogs[d] || []).includes(h.id);
      return `<span class="${on?'on':''}" title="${d}"></span>`;
    }).join('');
    return `
      <div class="card section-gap">
        <div class="row" style="justify-content:space-between;">
          <div>
            <div class="habit-name">${escapeHtml(h.name)}</div>
            <div class="streak">${streak > 0 ? streak + ' días seguidos 🔥' : 'Sin racha activa'}</div>
          </div>
          <button class="btn-icon" onclick="deleteHabit('${h.id}')">✕</button>
        </div>
        <div class="heat heat30 gap-top">${cells}</div>
      </div>`;
  }).join('');

  return `
    <h2>Hábitos</h2>
    ${checkSection}
    ${overallChart}
    ${habitCards}
    <div class="card section-gap">
      <h3>Nuevo hábito</h3>
      <div class="row">
        <input type="text" id="newHabitName" placeholder="Ej: Dormir 8 horas">
        <button class="btn" onclick="addHabit()">Agregar</button>
      </div>
    </div>`;
}
function dayNum(key){
  return String(parseInt(key.split('-')[2], 10));
}
function renderBarChart(items, opts={}){
  const w = 600, h = 140, pad = 20;
  const maxVal = opts.max || Math.max(...items.map(i => i.value), 1);
  const n = items.length;
  const barW = (w - 2*pad) / n;
  const bars = items.map((it, i) => {
    const bh = maxVal > 0 ? (it.value / maxVal) * (h - 2*pad - 16) : 0;
    const x = pad + i*barW + barW*0.18;
    const y = h - pad - bh - 14;
    const bw = barW * 0.64;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,0).toFixed(1)}" rx="3" fill="var(--accent)"/>`;
  }).join('');
  const labels = items.map((it, i) => {
    const x = pad + i*barW + barW/2;
    return `<text x="${x.toFixed(1)}" y="${h-6}" font-size="8" fill="var(--text-dim)" text-anchor="middle">${escapeHtml(String(it.label))}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="chart bar-chart" preserveAspectRatio="none">${bars}${labels}</svg>`;
}
function addHabit(){
  const input = document.getElementById('newHabitName');
  const name = input.value.trim();
  if(!name) return;
  state.habits.push({ id: uid(), name });
  saveState(); render();
}
function deleteHabit(id){
  state.habits = state.habits.filter(h => h.id !== id);
  saveState(); render();
}

/* ---------- RUTINAS ---------- */
function renderRutinas(){
  const cards = state.routines.map(r => {
    const exChips = r.exercises.map(({exerciseId, target}) => {
      const ex = state.exercises.find(e => e.id === exerciseId);
      if(!ex) return '';
      return `<span class="chip">${escapeHtml(ex.name)} ${target ? `<span class="t">${escapeHtml(target)}</span>` : ''} <button onclick="removeExerciseFromRoutine('${r.id}','${exerciseId}')">✕</button></span>`;
    }).join('');
    return `
      <div class="card routine-card">
        <div class="title-row">
          <input type="text" value="${escapeHtml(r.name)}" onchange="renameRoutine('${r.id}', this.value)">
          <button class="btn-icon" onclick="deleteRoutine('${r.id}')">✕</button>
        </div>
        <div class="chip-row">${exChips || '<span class="empty" style="padding:0;font-size:12px;">Sin ejercicios</span>'}</div>
        <div class="row gap-top">
          <input type="text" id="newEx-${r.id}" placeholder="Ejercicio">
          <input type="text" id="newTarget-${r.id}" placeholder="4x8-10" style="max-width:80px;">
          <button class="btn" onclick="addExerciseToRoutine('${r.id}')">+</button>
        </div>
      </div>`;
  }).join('');
  return `
    <h2>Rutinas</h2>
    ${state.routines.length===0 ? '<div class="card"><p class="empty">Creá tus días de entrenamiento y agregales ejercicios.</p></div>' : cards}
    <div class="card section-gap">
      <h3>Nueva rutina</h3>
      <div class="row">
        <input type="text" id="newRoutineName" placeholder="Ej: Día de empuje">
        <button class="btn" onclick="addRoutine()">Crear</button>
      </div>
    </div>`;
}
function addRoutine(){
  const input = document.getElementById('newRoutineName');
  const name = input.value.trim();
  if(!name) return;
  state.routines.push({ id: uid(), name, exercises: [] });
  saveState(); render();
}
function deleteRoutine(id){
  state.routines = state.routines.filter(r => r.id !== id);
  saveState(); render();
}
function renameRoutine(id, name){
  const r = state.routines.find(r => r.id === id);
  if(r && name.trim()) r.name = name.trim();
  saveState(); render();
}
function addExerciseToRoutine(routineId){
  const nameInput = document.getElementById('newEx-'+routineId);
  const targetInput = document.getElementById('newTarget-'+routineId);
  const name = nameInput.value.trim();
  const target = targetInput.value.trim();
  if(!name) return;
  let ex = state.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
  if(!ex){ ex = { id: uid(), name }; state.exercises.push(ex); }
  const routine = state.routines.find(r => r.id === routineId);
  if(!routine.exercises.find(e => e.exerciseId === ex.id)) routine.exercises.push({ exerciseId: ex.id, target });
  saveState(); render();
}
function removeExerciseFromRoutine(routineId, exId){
  const routine = state.routines.find(r => r.id === routineId);
  routine.exercises = routine.exercises.filter(e => e.exerciseId !== exId);
  saveState(); render();
}

/* ---------- PROGRESO ---------- */
function renderProgreso(){
  if(state.exercises.length === 0){
    return `<h2>Progreso</h2><div class="card"><p class="empty">Todavía no hay ejercicios cargados.</p></div>`;
  }
  if(!progressExerciseId || !state.exercises.find(e => e.id === progressExerciseId)){
    progressExerciseId = state.exercises[0].id;
  }

  const sortedEx = state.exercises.slice().sort((a,b) => a.name.localeCompare(b.name));
  const gridBoxes = sortedEx.map(ex => {
    const last = findLastSetForExercise(ex.id);
    const w = last ? last.weight + ' kg' : '—';
    const sel = ex.id === progressExerciseId ? 'selected' : '';
    return `
      <div class="exercise-box ${sel}" onclick="selectProgressExercise('${ex.id}')">
        <div class="w">${w}</div>
        <div class="n">${escapeHtml(ex.name)}</div>
      </div>`;
  }).join('');

  const sessions = [];
  Object.keys(state.logs).sort().forEach(date => {
    const sets = state.logs[date].sets.filter(s => s.exerciseId === progressExerciseId);
    if(sets.length === 0) return;
    const maxWeight = Math.max(...sets.map(s => s.weight));
    sessions.push({ date, maxWeight, count: sets.length });
  });

  let prBlock, chartBlock, historyBlock;
  if(sessions.length === 0){
    prBlock = '';
    chartBlock = '<p class="empty">Todavía no registraste series de este ejercicio.</p>';
    historyBlock = '';
  } else {
    const pr = Math.max(...sessions.map(s => s.maxWeight));
    prBlock = `<div class="pr-box"><div class="pr-label">Récord personal</div><div class="pr-value">${pr}<span class="pr-unit"> kg</span></div></div>`;
    chartBlock = renderChart(sessions);
    historyBlock = sessions.slice().reverse().map(s => `
      <div class="history-item">
        <span class="d">${formatDateShort(s.date)}</span>
        <span class="w">${s.maxWeight} kg <span style="color:var(--text-dim);font-weight:400;">· ${s.count} series</span></span>
      </div>`).join('');
  }

  return `
    <h2>Progreso</h2>
    <div class="exercise-grid">${gridBoxes}</div>
    <div class="card section-gap">
      ${prBlock}
      ${chartBlock}
    </div>
    ${historyBlock ? `<div class="card section-gap"><h3>Historial</h3>${historyBlock}</div>` : ''}`;
}
function formatDateShort(key){
  const [y,m,d] = key.split('-');
  const date = new Date(y, m-1, d);
  return date.toLocaleDateString('es-ES', { day:'2-digit', month:'short' });
}
function renderChart(sessions){
  const w = 600, h = 160, pad = 26;
  const weights = sessions.map(s => s.maxWeight);
  const minW = Math.min(...weights), maxW = Math.max(...weights);
  const range = (maxW - minW) || 1;
  const stepX = sessions.length > 1 ? (w - 2*pad) / (sessions.length - 1) : 0;
  const pts = sessions.map((s,i) => {
    const x = pad + i*stepX;
    const y = h - pad - ((s.maxWeight - minW) / range) * (h - 2*pad);
    return { x, y, isPR: s.maxWeight === maxW };
  });
  const line = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.isPR?5:3}" fill="${p.isPR?'var(--accent)':'var(--steel)'}" />`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" preserveAspectRatio="none">
    <polyline points="${line}" fill="none" stroke="var(--steel)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    ${dots}
  </svg>`;
}

/* ---------- PLAN ---------- */
function logBodyWeight(){
  const input = document.getElementById('bwInput');
  const val = parseFloat(input.value);
  if(!val) return;
  state.bodyWeightLogs[todayKey()] = val;
  input.value = '';
  saveState(); render();
}
/* ---------- DUO: progreso compartido con tu compañero ---------- */
function memberKey(name){ return 'duo:' + name.trim().toLowerCase(); }

function daysAgoLabel(key){
  if(!key) return 'sin registros';
  const today = todayKey();
  if(key === today) return 'hoy';
  const [y,m,d] = key.split('-').map(Number);
  const [ty,tm,td] = today.split('-').map(Number);
  const diff = Math.round((Date.UTC(ty,tm-1,td) - Date.UTC(y,m-1,d)) / 86400000);
  if(diff === 1) return 'ayer';
  if(diff > 1) return `hace ${diff} días`;
  return formatDateShort(key);
}

function buildMySummary(){
  const name = (state.profile.name || '').trim();
  const bwEntries = Object.keys(state.bodyWeightLogs).sort();
  const weight = bwEntries.length ? state.bodyWeightLogs[bwEntries[bwEntries.length-1]] : null;
  const weightDate = bwEntries.length ? bwEntries[bwEntries.length-1] : null;

  let workoutsThisWeek = 0, setsThisWeek = 0;
  for(let i=0;i<7;i++){
    const log = state.logs[dateKeyOffset(i)];
    if(log && log.sets && log.sets.length){ workoutsThisWeek++; setsThisWeek += log.sets.length; }
  }
  const loggedDates = Object.keys(state.logs).filter(k => state.logs[k].sets && state.logs[k].sets.length).sort();
  const lastWorkoutDate = loggedDates.length ? loggedDates[loggedDates.length-1] : null;

  const habits = state.habits.map(h => ({ name: h.name, streak: computeStreak(h.id) }));

  return { name, updatedAt: Date.now(), weight, weightDate, workoutsThisWeek, setsThisWeek, lastWorkoutDate, habits };
}

async function pushMySummary(){
  const name = (state.profile.name || '').trim();
  if(!name) return;
  try{ await window.storage.set(memberKey(name), JSON.stringify(buildMySummary()), true); }
  catch(e){ console.error('No se pudo sincronizar el progreso', e); }
}

async function refreshDuo(){
  duoLoading = true; render();
  try{
    const list = await window.storage.list('duo:', true);
    const keys = (list && list.keys) || [];
    const results = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) results.push(JSON.parse(r.value));
      }catch(e){ /* skip */ }
    }
    duoMembers = results.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
  }catch(e){ console.error('No se pudo cargar el dúo', e); }
  duoLoading = false; render();
}

function summaryCardHtml(s, isMe){
  const habitsHtml = s.habits && s.habits.length
    ? s.habits.map(h => `<span class="set-chip">${escapeHtml(h.name)} ${h.streak > 0 ? h.streak + '🔥' : '—'}</span>`).join('')
    : '<span class="empty" style="padding:0;font-size:12px;">Sin hábitos cargados</span>';
  return `
    <div class="card section-gap">
      <div class="row" style="justify-content:space-between;">
        <h3 style="margin:0;">${isMe ? 'Vos' : escapeHtml(s.name)}</h3>
        ${isMe ? `<button class="btn-icon" onclick="switchIdentity()">cambiar de usuario</button>` : ''}
      </div>
      <div class="goal-row">
        <div>
          <div class="pr-label">Peso actual</div>
          <div class="goal-num">${s.weight !== null && s.weight !== undefined ? s.weight + ' kg' : '—'}</div>
        </div>
        <div class="goal-arrow">${s.weightDate ? 'Actualizado ' + daysAgoLabel(s.weightDate) : 'Sin registros de peso'}</div>
      </div>
      <div class="row gap-top" style="justify-content:space-between;">
        <div class="plan-item" style="margin:0;"><span class="lbl">Esta semana</span>${s.workoutsThisWeek} entrenos · ${s.setsThisWeek} series</div>
        <div class="plan-item" style="margin:0; text-align:right;"><span class="lbl">Último entreno</span>${daysAgoLabel(s.lastWorkoutDate)}</div>
      </div>
      <div class="sets-list gap-top">${habitsHtml}</div>
    </div>`;
}

function renderDuo(){
  const myName = identityName;

  const others = duoMembers.filter(m => m.name.trim().toLowerCase() !== myName.toLowerCase());
  const mine = duoMembers.find(m => m.name.trim().toLowerCase() === myName.toLowerCase()) || buildMySummary();

  let othersHtml;
  if(duoLoading && duoMembers.length === 0){
    othersHtml = `<div class="card section-gap"><p class="empty">Cargando progreso del dúo…</p></div>`;
  } else if(others.length === 0){
    othersHtml = `<div class="card section-gap"><p class="empty">Todavía no vemos a tu compañero. Cuando abra esta app y elija su nombre, su progreso va a aparecer acá.</p></div>`;
  } else {
    othersHtml = others.map(s => summaryCardHtml(s, false)).join('');
  }

  return `
    <h2>Dúo · Progreso compartido</h2>
    ${summaryCardHtml(mine, true)}
    ${othersHtml}
  `;
}

boot();
</script>
</body>
